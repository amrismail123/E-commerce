server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION:7200}
  refresh-token-expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

websiteUrl: ${WEBSITE_URL:http://localhost:4242}

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY}

logging:
  level:
    root: INFO
    com.example.mooshproject: DEBUG
    org.hibernate.SQL: DEBUG